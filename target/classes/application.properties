# Common settings for all environments
spring.application.name=pdf-generator-template
spring.profiles.active=dev

# JPA/Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging
logging.level.root=INFO
logging.level.com.template=DEBUG

# JWT Configuration
jwt.secret=your-secret-key-here-make-it-long-and-secure-for-production
# Access token expires in 15 minutes (900000 ms)
jwt.access-token.expiration=900000
# Refresh token expires in 7 days (604800000 ms)
jwt.refresh-token.expiration=604800000

# Account/session
auth.max-sessions-per-user=1
auth.max-login-attempts=5
auth.lock-duration-minutes=10
auth.account-expiry-years=1
auth.max-refresh-tokens-per-user=5

# OTP
app.otp.length=6
app.otp.expiry-minutes=10

# Error details for dev/test (override in prod)
server.error.include-message=always
server.error.include-binding-errors=always